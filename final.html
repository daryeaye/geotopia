<!DOCTYPE html>

<head>

  <title>Geotopia Pt7 Final</title>
  <style>
    /* Center the app container on the screen */
    body, html {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: black;
    }
    #app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* The container remains 960px x 540px */
    #container {
      position: relative;
      width: 960px;
      height: 540px;
      border: 1px solid #ccc;
      background: white;
      overflow: hidden;
    }
    /* Pages are absolutely positioned inside the container */
    .page {
      position: absolute;
      top: 0;
      left: 0;
      width: 960px;
      height: 540px;
      display: none;
      background-size: cover;
      background-position: center;
    }
    .page.active {
      display: block;
    }
    /* Typeable boxes (inputs) styling */
    input[type="text"] {
      font-family: "Comic Sans MS", sans-serif;
      font-size: 18px;
      padding: 5px;
      box-sizing: border-box;
    }
    /* Navigation buttons styling */
    #nav-buttons {
      margin-top: 10px;
    }
    button {
      font-family: "Comic Sans MS", sans-serif;
      font-size: 20px;
      background-color: lightblue;
      border: none;
      padding: 10px 20px;
      margin: 0 5px;
      cursor: pointer;
    }
    /* Local back button styling for pages 7-12 (now lower right corner) */
    .local-back {
      position: absolute;
      bottom: 10px;
      right: 10px;
      font-family: "Comic Sans MS", sans-serif;
      font-size: 20px;
      background-color: lightblue;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      z-index: 2;
    }
    /* Side widget styling */
    #side-widget {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 200px;
      height: 200px;
      background: #f9f9f9;
      border: 1px solid #ccc;
      padding: 10px;
      box-sizing: border-box;
      font-family: 'Caveat', cursive;
      z-index: 999;
      transition: all 0.25s ease;
    }
    #side-widget.collapsed {
      width: 120px;
      height: 24px;
      padding: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgba(249,249,249,0.95);
      border: 1px solid #ccc;
      font-family: "Comic Sans MS", sans-serif;
      font-size: 8px;
      line-height: 1;
      white-space: nowrap;
    }
    #side-widget.collapsed * {
      display: none !important;
    }
    #side-widget.collapsed::after {
      content: "Translation";
    }
    #collapse-widget {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      padding: 0;
      line-height: 1;
      font-size: 14px;
      background: lightblue;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: "Comic Sans MS", sans-serif;
    }
    #side-widget p.title {
      font-size: 24px;
      text-align: center;
      margin: 0 0 10px;
    }
    #side-widget button:not(#collapse-widget),
    #side-widget a {
      display: block;
      margin: 0 auto;
      font-size: 20px;
      cursor: pointer;
      text-align: center;
      background: lightblue;
      border: none;
      padding: 10px;
      text-decoration: none;
      color: inherit;
    }
    /* Selection overlay styles */
    #selection-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      z-index: 1000;
    }
    #selection-box {
      position: absolute;
      border: 2px dashed red;
      background: rgba(0,0,0,0.1);
    }
    /* Invisible clickable boxes on Page 6 */
    .box {
      position: absolute;
      cursor: pointer;
      background: transparent;
      border: none;
    }
    #pageTransitionOverlay{
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 10050;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }
  </style>

</head>

  <!-- Side Widget Script -->
  <script>
    document.getElementById('collapse-widget').addEventListener('click', function(e) {
      e.stopPropagation();
      document.getElementById('side-widget').classList.add('collapsed');
    });

    document.getElementById('side-widget').addEventListener('click', function() {
      if (this.classList.contains('collapsed')) {
        this.classList.remove('collapsed');
      }
    });

    document.getElementById('select-text').addEventListener('click', function() {
      const overlay = document.createElement('div');
      overlay.id = 'selection-overlay';
      document.body.appendChild(overlay);
      
      let startX, startY, selectionBox;
      
      overlay.addEventListener('mousedown', function(e) {
        startX = e.clientX;
        startY = e.clientY;
        
        selectionBox = document.createElement('div');
        selectionBox.id = 'selection-box';
        selectionBox.style.left = startX + 'px';
        selectionBox.style.top = startY + 'px';
        selectionBox.style.width = '0px';
        selectionBox.style.height = '0px';
        overlay.appendChild(selectionBox);
        
        function mouseMoveHandler(e) {
          const currentX = e.clientX;
          const currentY = e.clientY;
          const rectLeft = Math.min(startX, currentX);
          const rectTop = Math.min(startY, currentY);
          const rectWidth = Math.abs(currentX - startX);
          const rectHeight = Math.abs(currentY - startY);
          selectionBox.style.left = rectLeft + 'px';
          selectionBox.style.top = rectTop + 'px';
          selectionBox.style.width = rectWidth + 'px';
          selectionBox.style.height = rectHeight + 'px';
        }
        
        function mouseUpHandler(e) {
          overlay.removeEventListener('mousemove', mouseMoveHandler);
          overlay.removeEventListener('mouseup', mouseUpHandler);
          
          const boxRect = selectionBox.getBoundingClientRect();
          document.body.removeChild(overlay);
          
          const target = document.getElementById('container');
          const targetRect = target.getBoundingClientRect();
          
          html2canvas(target, { useCORS: true, allowTaint: false }).then(canvas => {
            const scaleFactor = canvas.width / targetRect.width;
            const sx = (boxRect.left - targetRect.left) * scaleFactor;
            const sy = (boxRect.top - targetRect.top) * scaleFactor;
            const sWidth = boxRect.width * scaleFactor;
            const sHeight = boxRect.height * scaleFactor;
            
            const croppedCanvas = document.createElement('canvas');
            croppedCanvas.width = sWidth;
            croppedCanvas.height = sHeight;
            const ctx = croppedCanvas.getContext('2d');
            ctx.drawImage(canvas, sx, sy, sWidth, sHeight, 0, 0, sWidth, sHeight);
            
            croppedCanvas.toBlob(blob => {
              if (blob) {
                const item = new ClipboardItem({ 'image/png': blob });
                navigator.clipboard.write([item]).then(() => {
                  alert('Screenshot copied to clipboard.');
                }).catch(err => {
                  console.error('Failed to copy screenshot to clipboard', err);
                  alert('Failed to copy screenshot to clipboard.');
                });
              }
            });
          });
        }
        
        overlay.addEventListener('mousemove', mouseMoveHandler);
        overlay.addEventListener('mouseup', mouseUpHandler);
      });
    });
  </script>
  
  <!-- Main Code Script -->
  <script>
    let currentPage = 1;
    const totalPages = 12;
    
    let isPageTransitioning = false;

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function runCanvasTransition(action) {
      const overlay = document.getElementById("pageTransitionOverlay");
      if (!overlay) {
        action();
        return;
      }
      isPageTransitioning = true;
      overlay.style.pointerEvents = "auto";
      overlay.style.opacity = "1";
      await wait(280);
      action();
      await wait(60);
      overlay.style.opacity = "0";
      await wait(280);
      overlay.style.pointerEvents = "none";
      isPageTransitioning = false;
    }

    function displayPage(pageNum) {
      // Hide all pages
      for (let i = 1; i <= totalPages; i++) {
        document.getElementById('page' + i).classList.remove('active');
      }
      // Show the target page
      document.getElementById('page' + pageNum).classList.add('active');

      // Global Navigation button visibility:
      // Hide the next/previous buttons on pages 7 to 12.
      if (pageNum >= 7 && pageNum <= 12) {
        document.getElementById("prev-btn").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
      } else if (pageNum === 1) {
        document.getElementById("prev-btn").style.display = "none";
        document.getElementById("next-btn").style.display = "inline-block";
      } else if (pageNum === 6) {
        // On page 6, only show Previous button
        document.getElementById("prev-btn").style.display = "inline-block";
        document.getElementById("next-btn").style.display = "none";
      } else if (pageNum === 5) {
        // For page 5, show both so that Next functions as unlock
        document.getElementById("prev-btn").style.display = "inline-block";
        document.getElementById("next-btn").style.display = "inline-block";
      } else {
        document.getElementById("prev-btn").style.display = "inline-block";
        document.getElementById("next-btn").style.display = "inline-block";
      }
      currentPage = pageNum;
    }

    async function showPage(pageNum) {
      pageNum = Number(pageNum);
      if (!document.getElementById('page' + pageNum)) return;
      if (isPageTransitioning) return;
      if (pageNum === currentPage) {
        displayPage(pageNum);
        return;
      }
      await runCanvasTransition(function() {
        displayPage(pageNum);
      });
    }

    function nextPage() {
      // For page 5, next button works as an unlock button
      if (currentPage === 5) {
        const userInput = document.getElementById('input5').value.trim();
        if(userInput === '3121322'){
          showPage(6);
        } else {
          alert("💀Incorrect Key💀");
        }
      } else {
        if (currentPage < totalPages) {
          showPage(currentPage + 1);
        }
      }
    }
    
    function prevPage() {
      if (currentPage > 1) {
        showPage(currentPage - 1);
      }
    }
    
    function checkAnswer(inputId, expected, successAction) {
      const userInput = document.getElementById(inputId).value.trim();
      if(userInput === expected) {
        successAction();
      } else {
        alert("💀Incorrect Key💀");
      }
    }
    
    document.addEventListener("DOMContentLoaded", function() {
      showPage(currentPage);
    });
  </script>
